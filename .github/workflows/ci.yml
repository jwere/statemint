name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and run tests
        run: mvn -B -ntp verify

  migrations:
    name: Database migrations (PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: statemint
          POSTGRES_USER: statemint
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statemint -d statemint"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Apply every migration in order
        env:
          PGPASSWORD: ci-only-password
        run: |
          for f in $(ls src/main/resources/db/migration/V*.sql | sort -V); do
            echo "Applying $f"
            psql -h localhost -U statemint -d statemint -v ON_ERROR_STOP=1 -f "$f"
          done
